version: "3.9"

# Minimal compose for the frontend. Backend / DB / AI services are owned by
# Members 1 & 3 — uncomment as they land (see .env.example for their vars).

services:
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./apps/web:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}

  # ── Member 1: database (Supabase locally → Postgres + PostGIS + pgvector) ──
